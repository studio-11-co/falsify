version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # mcp 2.0 removed the decorator registration API that mcp_server/server.py
      # is built on, so widening the pin past <2 breaks the MCP surface. The
      # mcp-test job catches it, but the PR comes back every week; this stops
      # the noise without hiding patch and minor releases. Drop this entry once
      # the server is ported to the MCPServer class.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
