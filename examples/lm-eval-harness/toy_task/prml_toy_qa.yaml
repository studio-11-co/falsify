task: prml_toy_qa
dataset_path: json
dataset_kwargs:
  data_files:
    # Resolved against the working directory; run_with_prml.py chdirs to the
    # example root, so this path works from any invocation directory.
    test: toy_task/toy_qa.jsonl
test_split: test
output_type: generate_until
doc_to_text: "Q: {{question}}\nA:"
doc_to_target: "{{answer}}"
generation_kwargs:
  until:
    - "\n"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
