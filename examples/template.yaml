# Falsification Engine — claim spec
#
# ⛔ THIS IS NOT A PRML MANIFEST. It is the input format of the workflow
#    engine, which is a different tool with a different schema. The command is
#    `falsify-engine`, NOT `falsify`. Running `falsify lock` on this file exits 2
#    with "missing required field: version / claim_id / created_at" — correctly,
#    because those are PRML fields and this file has none of them.
#
#    For a PRML manifest:  falsify init my-claim.prml.yaml
#    Worked PRML example:  examples/first-manifest/accuracy.prml.yaml
#    See examples/README.md.
#
# HOW THIS FILE IS USED (it is a template, not a runnable input):
#     falsify-engine init my-claim          # scaffolds .falsify/my-claim/spec.yaml
#     $EDITOR .falsify/my-claim/spec.yaml   # fill in every placeholder
#     falsify-engine lock my-claim          # takes a claim NAME, not a file path
# Placeholders: "<...>", TODO, FIXME, REPLACE_ME, XXX.
# A spec with any placeholder left in a string field cannot be locked
# (the CLI will exit 2: bad spec).

claim: "<one-sentence hypothesis that can, in principle, be proven wrong>"

falsification:
  failure_criteria:
    - metric: "<metric name, must match a key returned by metric_fn>"
      direction: "<above|below|equals>"
      threshold: 0.0  # TODO: real threshold
  minimum_sample_size: 1  # TODO: real n
  stopping_rule: "<when to stop — e.g. 'after 1000 samples' or 'after 1 epoch'>"

experiment:
  command: "<shell command that runs the experiment, e.g. python run.py>"
  dataset: "<path or identifier of the dataset under test>"
  metric_fn: "<module:function>"  # e.g. my_pkg.metrics:accuracy

environment:
  python: "3.11"
  packages:
    - "<package==version>"

artifacts:
  outputs:
    - "<path/to/expected/output>"
